<div class="app-shell">
  <header class="app-bar">
    <div class="app-brand">
      <strong>TinyRobot AI</strong>
      @if (runtime && runtimeMode === 'demo') {
        <span class="app-mode-badge" title="未配置 .env 模型密钥，当前使用本地流式演示回复">本地演示模式</span>
      }
    </div>
    <nav aria-label="应用页面">
      <a href="/chat" [attr.aria-current]="!workspace ? 'page' : null">完整聊天</a>
      <a href="/workspace" [attr.aria-current]="workspace ? 'page' : null">工作台</a>
      <button type="button" aria-label="切换主题" (click)="toggleTheme()">{{ dark ? '浅色模式' : '深色模式' }}</button>
    </nav>
  </header>
  @if (runtime) {
    @if (workspace) {
      <app-workspace-page [runtime]="runtime" [ui]="ui" />
    } @else {
      <app-chat-page [runtime]="runtime" [ui]="ui" />
    }
  } @else {
    <main class="setup">
      <h1>{{ error ? '模型配置无法加载' : '正在初始化对话服务' }}</h1>
      <p>{{ error || '正在准备 TinyRobot Chat Runtime…' }}</p>
    </main>
  }
</div>
